{% extends "book/base.html" %}
{% block title %}Books{% endblock title %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-6 text-center">Book List</h1>
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
     {% for book in books %}
<div class="bg-white rounded-lg shadow-md overflow-hidden flex flex-col h-full">
    {% if book.cover_image %}
        <img src="{{ book.cover_image.url }}" alt="{{ book.title }}" class="w-full h-48 object-cover">
    {% else %}
        <div class="w-full h-48 bg-gray-200 flex items-center justify-center text-gray-500">
            No Image
        </div>
    {% endif %}
    <div class="p-4 flex-1 flex flex-col">
        <h2 class="text-xl font-semibold mb-2">{{ book.title }}</h2>
        <p class="text-gray-600 mb-4">by {{ book.author }}</p>
       <button class=" mt-auto bg-orange-400 p-2 rounded"> <a href="">View Details</a></button>
    </div>
</div>
{% endfor %}
    </div>
</div>
{% endblock %}
