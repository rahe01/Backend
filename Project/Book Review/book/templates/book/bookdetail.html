{% extends "book/base.html" %}
{% block title %}Book Detail{% endblock title %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-3xl mx-auto bg-white rounded-lg shadow-md overflow-hidden">
        {% if book.cover_image %}
            <img src="{{ book.cover_image.url }}" alt="{{ book.title }}" class="w-full h-96 object-cover">
        {% else %}
            <div class="w-full h-96 bg-gray-200 flex items-center justify-center text-gray-500">
                No Image
            </div>
        {% endif %}
        <div class="p-6">
            <h1 class="text-3xl font-bold mb-4">{{ book.title }}</h1>
            <h2 class="text-xl text-gray-700 mb-2">by {{ book.author }}</h2>
            <p class="text-gray-600 mb-4">{{ book.description }}</p>
            <a href="{% url 'books' %}" class="btn bg-orange-400">Back to Book List</a>
            <a href="" class="btn bg-rose-500">Delete</a>
            <a href="" class="btn bg-yellow-600">Edit</a>
        </div>
    </div>
</div>
{% endblock content %}
