{% extends "book/base.html" %}

{% block title %}Add Book{% endblock title %}

{% block content %}
<div class="max-w-md mx-auto mt-10 p-6 bg-white rounded-lg shadow-md">
    <h2 class="text-2xl font-bold mb-6 text-center">Add a New Book</h2>
    <form method="post" class="space-y-4" enctype="multipart/form-data" >
        {% csrf_token %}
        {{form.as_p}}
        <div class="text-center">
            <button type="submit" class="bg-red-500 text-white px-4 py-2   rounded hover:bg-orange-800 transition">Submit</button>
        </div>
    </form>
</div>
{% endblock content %}
