<!-- templates/your_app/nav.html -->
<nav class="bg-orange-400 text-white shadow-md">
  <div class="container mx-auto px-4 py-3 flex justify-between items-center">
    <!-- Logo -->
    <a href="{% url 'home' %}" class="text-2xl font-bold">BookNest</a>

    <!-- Menu Links (Desktop) -->
    <ul class="hidden md:flex space-x-6">
      <li><a href="{% url 'home' %}" class="hover:text-gray-200 transition">Home</a></li>
      <li><a href="{% url 'addform' %}" class="hover:text-gray-200 transition">Add Book</a></li>
    
      <li><a href="{% url 'signup' %}" class="hover:text-gray-200 transition">Signup</a></li>

      <li><a href="{% url 'signin' %}" class="hover:text-gray-200 transition">Signin</a></li> 
    </ul>

    <!-- Hamburger (Mobile) -->
    <div class="md:hidden">
      <button id="mobile-menu-button" class="focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div id="mobile-menu" class="hidden md:hidden bg-blue-700">
    <ul class="flex flex-col space-y-2 p-4">
      <li><a href="{% url 'home' %}" class="block hover:text-gray-200">Home</a></li>
      {% comment %} <li><a href="{% url 'about' %}" class="block hover:text-gray-200">About</a></li>
      <li><a href="{% url 'services' %}" class="block hover:text-gray-200">Services</a></li>
      <li><a href="{% url 'contact' %}" class="block hover:text-gray-200">Contact</a></li> {% endcomment %}
    </ul>
  </div>
</nav>

<!-- Optional: Mobile Menu Toggle Script -->
<script>
  const btn = document.getElementById('mobile-menu-button');
  const menu = document.getElementById('mobile-menu');

  btn.addEventListener('click', () => {
    menu.classList.toggle('hidden');
  });
</script>
