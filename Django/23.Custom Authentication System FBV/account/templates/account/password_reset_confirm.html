{% extends "account/base.html" %}

{% block title %}Password Reset Confirm{% endblock title %}

{% block content %}
<div class="flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md p-8 space-y-6 bg-gray-800 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold text-center">Set New Password</h2>
        <form action="" method="POST" class="space-y-6">
            {% csrf_token %}

             {% comment %} Email{% endcomment %}
             <div>
                <label for="new_password1" class="block text-sm font-medium">New Password</label>
                <input type="password" name="new_password1" id='new_password1' , class="block w-full mt-1  rounded-md shadow-sm bg-gray-700 border-gray-300 p-2 " placeholder="....." required>
            </div>

             <div>
                <label for="new_password2" class="block text-sm font-medium">Confirm Password</label>
                <input type="password" name="new_password2" id='new_password2' , class="block w-full mt-1  rounded-md shadow-sm bg-gray-700 border-gray-300 p-2 " placeholder="....." required>
            </div>

           


            <button type="submit" id="submit-btn" class="w-full px-4 py-2 text-white bg-rose-500 rounded-md hover:bg-rose-700 focus:outline-none focus:bg-rose-400">Set Password</button>



        
        </form>
    </div>
</div>


{% endblock content%}
