<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Activation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            margin: 0;
            padding: 0;
        }
        .container {
            background: #fff;
            max-width: 500px;
            margin: 40px auto;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        h2 {
            color: #2d7ff9;
            margin-bottom: 20px;
        }
        a.button {
            display: inline-block;
            padding: 12px 24px;
            background: #2d7ff9;
            color: #fff !important;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 16px;
        }
        p {
            margin: 16px 0;
        }
        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Activate Your Account</h2>
        <p>Hi ,</p>
        <p>Thank you for registering. Please click the button below to activate your account:</p>
        <p><a href="" class="button">Activate Account</a></p>
        <p>If you did not register for this account, please ignore this email.</p>
        <div class="footer">
            Best regards,<br>Your Website Team
        </div>
    </div>
</body>
